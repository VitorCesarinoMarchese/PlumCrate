name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Fetch locked dependency graph for offline audit
        run: cargo fetch --manifest-path native/Cargo.toml --locked
      - name: Core regression tests
        run: cargo test --manifest-path core/Cargo.toml --locked
      - name: Native regression tests
        run: cargo test --manifest-path native/Cargo.toml --locked
      - name: Repository and benchmark regression
        run: python3 -m unittest discover -s native/tests -p 'test_*.py'
      - name: Native clippy
        run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build release
        run: cargo build --manifest-path native/Cargo.toml --release --locked
      - name: Verify Linux release ABI
        run: python3 native/verify_abi.py --binary native/target/release/plumcrate
      - name: Verify release catalog fixtures
        run: python3 native/verify.py --binary native/target/release/plumcrate
      - name: Verify management workflow fixtures
        run: native/target/release/plumcrate --verify-workflows
      - name: Verify packaged executable
        run: python3 native/verify_package.py --binary native/target/release/plumcrate
      - name: Package Linux release
        run: python3 native/package.py --binary native/target/release/plumcrate
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: native/target/packages/*.tar.gz
