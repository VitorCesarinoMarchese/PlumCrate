[package]
name = "ts4-mod-manager-native"
version = "0.0.1-alpha.1"
license = "MIT"
edition = "2024"
rust-version = "1.98"

[dependencies]
ts4-mod-manager-core = { path = "../core" }
eframe = { version = "0.36.1", default-features = false, features = ["glow", "wayland", "x11", "accesskit"] }
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["svg", "image", "file", "http"] }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
fastframe-text = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
fastframe-scroll = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
fastframe-log = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
url = "2"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

[dev-dependencies]
